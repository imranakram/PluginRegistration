name: Release

# Run from the Actions tab on master. The version defaults to the next 3.<yyyy>.<MM>.<rrr> for the
# current month (replacing the ADO "PRT-CI" build number + ApplyVersionToAssemblies step).
# Release notes are taken from <releaseNotes> in Xrm.Sdk.PluginRegistration.nuspec.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override, e.g. 3.2026.10.1 (leave empty for the next one this month)'
        required: false
        default: ''
      publish_nuget:
        description: 'Push the package to nuget.org'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases are only created from master (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ($env:VERSION_INPUT) {
            if ($env:VERSION_INPUT -notmatch '^3\.(\d{4})\.(\d{1,2})\.(\d{1,3})$') {
              throw "Version '$env:VERSION_INPUT' must look like 3.2026.10.1"
            }
            $year = $Matches[1]; $month = [int]$Matches[2]; $rev = [int]$Matches[3]
          }
          else {
            $now = [DateTime]::UtcNow
            $year = $now.ToString('yyyy'); $month = $now.Month
            $pattern = "3.$year.$($month.ToString('00'))."
            $revs = git tag -l "PRT-$pattern*" "PRT-CI-$pattern*" | ForEach-Object { [int]($_ -split '\.')[-1] }
            $rev = 1 + ($revs | Measure-Object -Maximum).Maximum
          }

          # Same shapes as earlier releases: tag/file version 3.2026.04.001, NuGet version 3.2026.4.1
          $display = '3.{0}.{1:00}.{2:000}' -f $year, $month, $rev
          $nuget = '3.{0}.{1}.{2}' -f $year, $month, $rev
          $tag = "PRT-$display"

          if (git tag -l $tag) { throw "Tag $tag already exists" }

          Write-Host "Releasing $tag (NuGet $nuget)"
          "display=$display" >> $env:GITHUB_OUTPUT
          "nuget=$nuget" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Apply version to AssemblyInfo
        shell: pwsh
        run: |
          $file = 'Xrm.Sdk.PluginRegistration\Properties\AssemblyInfo.cs'
          $version = '${{ steps.version.outputs.display }}'
          $content = Get-Content $file -Raw
          $content = $content -replace 'Assembly(File)?Version\("[^"]*"\)', "Assembly`$1Version(""$version"")"
          Set-Content $file $content -NoNewline -Encoding utf8BOM
          Select-String -Path $file -Pattern 'AssemblyVersion|AssemblyFileVersion'

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Build
        run: msbuild PluginRegistration.sln -restore -m -p:Configuration=Release -v:minimal -nologo

      - name: Test
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -find "**\TestPlatform\vstest.console.exe" | Select-Object -First 1
          & $vstest Xrm.Sdk.PluginRegistration.Tests\bin\Release\Xrm.Sdk.PluginRegistration.Tests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack
        shell: pwsh
        run: |
          nuget pack Xrm.Sdk.PluginRegistration.nuspec -Version ${{ steps.version.outputs.nuget }} -OutputDirectory out -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Zip with the XrmToolBox Plugins folder layout, for manual installs
          $nupkg = Get-ChildItem out\*.nupkg | Select-Object -First 1
          Expand-Archive $nupkg.FullName -DestinationPath out\nupkg
          Compress-Archive out\nupkg\lib\net48\Plugins -DestinationPath "out\Xrm.Sdk.PluginRegistration-${{ steps.version.outputs.display }}.zip"

          ([xml](Get-Content Xrm.Sdk.PluginRegistration.nuspec)).package.metadata.releaseNotes.Trim() |
            Set-Content out\release-notes.md

      - name: Push to nuget.org
        if: inputs.publish_nuget
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) { throw "The NUGET_API_KEY repository secret is not set" }
          nuget push out\*.nupkg -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json -SkipDuplicate -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Tag last, so a failed build or push leaves no tag behind and the run can simply be repeated
      - name: Create tag and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} `
            --target ${{ github.sha }} `
            --title "${{ steps.version.outputs.tag }}" `
            --notes-file out\release-notes.md `
            (Get-Item out\*.nupkg).FullName `
            (Get-Item out\*.zip).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
